name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: python3 scripts/select_ci_xcode.py

      - name: Install build formatter
        run: brew install xcbeautify

      - name: Build app
        run: make compile

      - name: Test app packages
        run: make test_all TEST_DESTINATION="$TEST_DESTINATION"

      - name: Retain build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          path: |
            build/*-raw.log
            build/TestResults/*.xcresult
          if-no-files-found: ignore
